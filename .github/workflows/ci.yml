name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  circular:
    name: Circular dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm circular

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

      - name: Prepare isolated package consumer
        run: |
          mkdir -p "$RUNNER_TEMP/effect-units-consumer"
          cp test/consumer/* "$RUNNER_TEMP/effect-units-consumer/"
          CI=1 pnpm pack --out "$RUNNER_TEMP/effect-units-consumer/effect-units.tgz"

      - name: Test consumer with minimum Effect version
        working-directory: ${{ runner.temp }}/effect-units-consumer
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm test

      - name: Test consumer with development Effect version
        run: |
          npm --prefix "$RUNNER_TEMP/effect-units-consumer" install --ignore-scripts --no-audit --no-fund --package-lock=false "effect@$(node -p 'require("./package.json").devDependencies.effect')"
          npm --prefix "$RUNNER_TEMP/effect-units-consumer" test
